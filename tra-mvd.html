<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tra Cứu Đơn Hàng</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 20px 10px; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .card { background: white; padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #1e293b; font-weight: 800; }
        .desc { font-size: 14px; color: #64748b; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; outline: none; text-align: center; font-weight: 600; }
        .note-mvd { font-size: 12px; color: #2563eb; margin-top: 8px; margin-bottom: 20px; font-style: italic; font-weight: 500; }
        button { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #resultBox { margin-top: 25px; padding: 20px; border-radius: 12px; display: none; }
        .success-box { background: #eff6ff; border: 1px dashed #3b82f6; }
        .error-box { background: #fef2f2; border: 1px dashed #ef4444; }
        .result-title { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .tracking-code { font-size: 22px; font-weight: 800; color: #2563eb; margin: 10px 0; word-break: break-all; }
        .no-code { font-size: 14px; color: #dc2626; font-style: italic; font-weight: 600; background: #fff1f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca; margin-top: 10px; }
        
        .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .copy-btn { padding: 10px 15px; background: #e2e8f0; color: #475569; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; font-weight: 600; flex: 1; transition: 0.2s; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .copy-btn:hover { background: #cbd5e1; }
        .spx-btn { background: #fb5532 !important; color: white !important; }
        .spx-btn:hover { background: #e54a2a !important; }

        .order-info-box { background: #ffffff; padding: 15px; border-radius: 10px; border: 1px solid #bfdbfe; text-align: left; font-size: 14px; line-height: 1.6; margin: 15px 0; color: #334155; }
        .highlight-money { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📦 Tra Cứu Đơn Hàng</h2>
        <p class="desc">Vui lòng nhập số điện thoại để xem trạng thái</p>
        
        <input type="tel" id="orderInput" placeholder="VD: 0912345678" maxlength="11">
        <div class="note-mvd">Sử dụng số điện thoại bạn đã đặt hàng để tra cứu</div>
        
        <button id="searchBtn" onclick="performSearch()">Tra cứu ngay</button>

        <div id="resultBox"></div>
        
        <a href="index.html" style="display: block; margin-top: 20px; font-size: 13px; color: #64748b; text-decoration: none;">← Quay lại trang nhập thông tin</a>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzDgyjlFxIpIbN-NgYjf6EAwbNprxXMSqHvqg2-wIQM011WZ_nBST8ykgC9Pb05AVlA/exec";

        async function performSearch() {
            const inputEle = document.getElementById('orderInput');
            const btnEle = document.getElementById('searchBtn');
            const resultBox = document.getElementById('resultBox');
            
            // Lấy thẳng số điện thoại và loại bỏ khoảng trắng
            let sdt = inputEle.value.trim();

            if (!sdt) {
                alert("Vui lòng nhập số điện thoại!");
                return;
            }

            // Chỉ giữ lại các chữ số
            sdt = sdt.replace(/\D/g, '');

            btnEle.innerText = "Đang tìm kiếm...";
            btnEle.disabled = true;
            resultBox.style.display = "none";

            try {
                // Đổi tham số truyền đi thành sdt
                const response = await fetch(`${API_URL}?sdt=${sdt}`);
                const data = await response.json();

                btnEle.innerText = "Tra cứu ngay";
                btnEle.disabled = false;
                resultBox.style.display = "block";
                
                if (data.status === "success") {
                    resultBox.className = "success-box";
                    
                    let balanceNum = Number(String(data.balance).replace(/[^0-9.-]+/g,"")); 
                    if (isNaN(balanceNum)) balanceNum = 0;

                    let paymentHtml = "";
                    
                    // NẾU ĐÃ THANH TOÁN (Trạng thái webhook gạch nợ thành công hoặc nợ = 0)
                    if (data.isPaid || balanceNum === 0) {
                        paymentHtml = `💰 <b>Trạng thái:</b> <span style="color:#059669; font-weight:bold;">✅ Đã thanh toán đầy đủ</span>`;
                    } 
                    // NẾU CÒN NỢ (Khách chỉ mới cọc, yêu cầu CK phần còn lại)
                    else {
                        paymentHtml = `💰 <b>Cần CK phần còn lại:</b> <span class="highlight-money">${balanceNum.toLocaleString('vi-VN')} VNĐ</span>
                        <div style="font-size:12px; color:#64748b; margin-top:2px;"><i>(Vui lòng chuyển khoản phần còn lại để hoàn tất)</i></div>`;
                    }

                    let mvd = data.maVanDon ? data.maVanDon.toString().trim() : "";
                    
                    const isInvalid = mvd === "" || 
                                     mvd.toLowerCase().includes("đang") || 
                                     mvd.toLowerCase().includes("chờ") || 
                                     mvd.toLowerCase().includes("lấy") ||
                                     mvd.toLowerCase().includes("trống");

                    let trackingDisplay = "";

                    if (!isInvalid) {
                        trackingDisplay = `
                            <div class="tracking-code" id="trackingCodeText">${mvd}</div>
                            <div class="btn-group">
                                <button class="copy-btn" onclick="copyCode()">📋 Copy</button>
                                <a href="https://spx.vn/#/detail/${mvd}" target="_blank" class="copy-btn spx-btn">🚚 Theo dõi đơn</a>
                            </div>
                        `;
                    } else {
                        trackingDisplay = `<div class="no-code">Đơn chưa đóng gói xong, vui lòng kiểm tra sau</div>`;
                    }

                    resultBox.innerHTML = `
                        <div class="result-title" style="color: #1d4ed8; font-size: 16px;">🎉 Đã tìm thấy đơn!</div>
                        
                        <div class="order-info-box">
                            👤 <b>Người nhận:</b> ${data.name}<br>
                            📞 <b>SĐT:</b> ${data.phone}<br>
                            🏠 <b>Địa chỉ:</b> ${data.address}<br>
                            ${paymentHtml}<br>
                            📝 <b>Ghi chú:</b> ${data.note || "Không có"}
                        </div>

                        <div class="result-title" style="color: #64748b; margin-top: 15px;">Mã vận đơn SPX:</div>
                        ${trackingDisplay}
                    `;
                } else {
                    resultBox.className = "error-box";
                    resultBox.innerHTML = `
                        <div class="result-title" style="color: #b91c1c;">❌ Không thấy đơn</div>
                        <div style="font-size: 13px; color: #991b1b;">Vui lòng kiểm tra lại số điện thoại hoặc bạn chưa đặt hàng</div>
                    `;
                }
            } catch (error) {
                btnEle.innerText = "Tra cứu ngay";
                btnEle.disabled = false;
                alert("Lỗi kết nối, vui lòng thử lại!");
            }
        }

        function copyCode() {
            const code = document.getElementById('trackingCodeText').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert("✅ Đã copy mã vận đơn!");
            });
        }
    </script>
</body>
</html>
